# ==============================================================================
# Mercado Central 24h — Docker Compose
# ==============================================================================

services:
  app:
    image: mercado-central-ia
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mercado-central-ia
    ports:
      - "8501:8501"
    volumes:
      # Persiste o banco vetorial ChromaDB entre restarts
      - vector_store:/app/rag/data/vector_store
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  vector_store:
    driver: local
